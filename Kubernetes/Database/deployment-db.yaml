apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: database
        image: docker.io/ishika979/studentapp-db:latest
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "password"
        - name: MYSQL_DATABASE
          value: "studentdb"
        - name: MYSQL_USER
          value: "student"
        - name: MYSQL_PASSWORD
          value: "password"
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: database-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: database-storage
        persistentVolumeClaim:
          claimName: database-pvc
